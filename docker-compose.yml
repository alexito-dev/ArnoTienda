services:
  tienda-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arnotienda_frontend
    restart: always
    networks:
      - coolify
    depends_on:
      - tienda-backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.arnotienda.rule=Host(`tienda.arno.services`)
      - traefik.http.routers.arnotienda.entrypoints=https
      - traefik.http.routers.arnotienda.tls=true
      - traefik.http.routers.arnotienda.tls.certresolver=letsencrypt
      - traefik.http.services.arnotienda.loadbalancer.server.port=80
      - traefik.http.routers.arnotienda-http.rule=Host(`tienda.arno.services`)
      - traefik.http.routers.arnotienda-http.entrypoints=http
      - traefik.http.routers.arnotienda-http.middlewares=arnotienda-redirect
      - traefik.http.middlewares.arnotienda-redirect.redirectscheme.scheme=https

  tienda-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arnotienda_backend
    restart: always
    networks:
      - coolify
    depends_on:
      tienda-postgres:
        condition: service_healthy
    environment:
      - PORT=3008
      - DATABASE_URL=postgresql://arno_admin:arno_tienda_secret_pass_2026@arnotienda_postgres:5432/arnotienda
      - BUNAISTORE_API_KEY=Shop::2WR8PHImP8Njh3kHI6twuz2AWF8

  tienda-postgres:
    image: postgres:16-alpine
    container_name: arnotienda_postgres
    restart: always
    networks:
      - coolify
    environment:
      POSTGRES_DB: arnotienda
      POSTGRES_USER: arno_admin
      POSTGRES_PASSWORD: arno_tienda_secret_pass_2026
    volumes:
      - arnotienda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arno_admin -d arnotienda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arnotienda_pgdata:

networks:
  coolify:
    external: true
